name: Nightly

# Temporarily disabled (manual trigger only); restore the schedule trigger to re-enable.
on:
  workflow_dispatch: {}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  integration-full-matrix:
    strategy:
      fail-fast: false
      matrix:
        # Floor version (466) and latest, per NFR-COMPAT-2 / TEST-6. Populated with real
        # scenarios starting in Phase 1; this is the scaffold (P0-T16).
        trino-version: [466, latest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore (locked mode)
        run: dotnet restore TriQL.slnx --locked-mode

      - name: Build
        run: dotnet build TriQL.slnx -c Release --no-restore

      - name: Integration tests against trinodb/trino:${{ matrix.trino-version }}
        env:
          TRIQL_TEST_TRINO_VERSION: ${{ matrix.trino-version }}
        run: dotnet test tests/TriQL.IntegrationTests -c Release --no-build

      # TODO (Phase 7): add the MinIO + spooling-configured Trino job here once the spooled
      # protocol is validated against a real object store (see docs/implementation-plan.md).
