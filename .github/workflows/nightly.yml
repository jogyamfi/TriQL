name: Nightly

on:
  schedule:
    # 03:00 UTC daily.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  integration-full-matrix:
    strategy:
      fail-fast: false
      matrix:
        # The minimum supported Trino version (466) and latest.
        trino-version: [466, latest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore (locked mode)
        run: dotnet restore TriQL.slnx --locked-mode

      - name: Build
        run: dotnet build TriQL.slnx -c Release --no-restore

      - name: Integration tests against trinodb/trino:${{ matrix.trino-version }}
        env:
          TRIQL_TEST_TRINO_VERSION: ${{ matrix.trino-version }}
        # Unlike ci.yml, nightly does not filter out Category=Spooling — this one
        # unfiltered run already exercises MinioFixture/SpoolingTrinoFixture and the
        # tests in tests/TriQL.IntegrationTests/Spooling/ across the full trino-version
        # matrix (both the minimum supported version and latest), since
        # SpoolingTrinoFixture.RequestedVersion honours the same TRIQL_TEST_TRINO_VERSION env var as
        # TrinoContainerFixture. No separate job is needed for that reason.
        run: dotnet test tests/TriQL.IntegrationTests -c Release --no-build

      - name: EF Core functional tests against trinodb/trino:${{ matrix.trino-version }}
        env:
          TRIQL_TEST_TRINO_VERSION: ${{ matrix.trino-version }}
        run: dotnet test tests/TriQL.EntityFrameworkCore.FunctionalTests -c Release --no-build
