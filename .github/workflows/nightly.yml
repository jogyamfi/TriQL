name: Nightly

on:
  schedule:
    # 03:00 UTC daily.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  integration-full-matrix:
    strategy:
      fail-fast: false
      matrix:
        # Floor version (466) and latest, per NFR-COMPAT-2 / TEST-6. Populated with real
        # scenarios starting in Phase 1; this is the scaffold (P0-T16).
        trino-version: [466, latest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore (locked mode)
        run: dotnet restore TriQL.slnx --locked-mode

      - name: Build
        run: dotnet build TriQL.slnx -c Release --no-restore

      - name: Integration tests against trinodb/trino:${{ matrix.trino-version }}
        env:
          TRIQL_TEST_TRINO_VERSION: ${{ matrix.trino-version }}
        # Phase 7 (P7-T4): unlike ci.yml, nightly does not filter out Category=Spooling — this one
        # unfiltered run already exercises MinioFixture/SpoolingTrinoFixture (P7-T1/P7-T2) and the
        # Lane B tests in tests/TriQL.IntegrationTests/Spooling/ across the full trino-version
        # matrix (both the NFR-COMPAT-2 floor version and latest), since
        # SpoolingTrinoFixture.RequestedVersion honours the same TRIQL_TEST_TRINO_VERSION env var as
        # TrinoContainerFixture. No separate job is needed for that reason.
        run: dotnet test tests/TriQL.IntegrationTests -c Release --no-build
