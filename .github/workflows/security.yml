name: Security

# Temporarily disabled (manual trigger only); restore pull_request/push/schedule triggers to re-enable.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: Build
        run: dotnet build TriQL.slnx -c Release

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

  vulnerable-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore (locked mode)
        run: dotnet restore TriQL.slnx --locked-mode

      - name: Fail on known vulnerable packages (SEC-8)
        run: |
          set -e
          output=$(dotnet list TriQL.slnx package --vulnerable --include-transitive 2>&1)
          echo "$output"
          if echo "$output" | grep -qi "has the following vulnerable packages"; then
            echo "::error::Vulnerable package(s) detected. See output above."
            exit 1
          fi
