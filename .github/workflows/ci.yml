name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore (locked mode)
        run: dotnet restore TriQL.slnx --locked-mode

      - name: Build (Release, warnings as errors)
        run: dotnet build TriQL.slnx -c Release --no-restore

      - name: Verify formatting
        run: dotnet format TriQL.slnx --verify-no-changes --no-restore

      - name: Unit tests with coverage (TriQL.Client.Tests)
        run: >
          dotnet test tests/TriQL.Client.Tests/TriQL.Client.Tests.csproj
          -c Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      - name: Unit tests with coverage (TriQL.Data.ADO.Tests)
        run: >
          dotnet test tests/TriQL.Data.ADO.Tests/TriQL.Data.ADO.Tests.csproj
          -c Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      # TEST-3: coverage is reported (not enforced). Results below the 85% line / 75% branch
      # targets surface as warnings but never fail the build. Reports for projects with no
      # coverable lines yet are skipped.
      - name: Report coverage (TEST-3, non-blocking)
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse ./coverage -Filter coverage.cobertura.xml
          if ($files.Count -eq 0) {
            Write-Host "::warning::No coverage reports were produced."
            exit 0
          }

          foreach ($file in $files) {
            [xml]$xml = Get-Content $file.FullName
            $linesValid = [int]$xml.coverage.'lines-valid'
            if ($linesValid -eq 0) {
              Write-Host "Skipping $($file.FullName) (no coverable lines yet)."
              continue
            }

            $lineRate = [double]$xml.coverage.'line-rate'
            $branchRate = [double]$xml.coverage.'branch-rate'
            $linePct = [math]::Round($lineRate * 100, 2)
            $branchPct = [math]::Round($branchRate * 100, 2)
            Write-Host "$($file.FullName): line=$linePct% branch=$branchPct%"

            if ($lineRate -lt 0.85) {
              Write-Host "::warning::Line coverage $linePct% is below the 85% target (TEST-3) for $($file.FullName)"
            }

            if ($branchRate -lt 0.75) {
              Write-Host "::warning::Branch coverage $branchPct% is below the 75% target (TEST-3) for $($file.FullName)"
            }
          }

          exit 0

      - name: Check for Docker
        id: docker-check
        shell: bash
        run: |
          # Require a Linux-container engine, not just any Docker: windows-latest ships Docker in
          # Windows-container mode, where `docker info` succeeds but trinodb/trino cannot be pulled.
          if [ "$(docker info --format '{{.OSType}}' 2>/dev/null)" = "linux" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::A Linux-container Docker engine is not available on this runner — integration tests are explicitly skipped, not silently passed (see Phase 0 risk register)."
          fi

      - name: Integration tests
        if: steps.docker-check.outputs.available == 'true'
        # The Phase 7 spooling suite (Category=Spooling) is excluded here and run instead by the
        # dedicated spooling-integration-tests job below: it starts two containers (MinIO plus a
        # spooling-configured coordinator) instead of one, measured at roughly 4-5x the runtime of
        # the rest of this suite, so folding it into this 3-OS matrix would slow every PR on every
        # OS for a suite that (per the docker-check gate above) only Linux runners can even execute.
        run: dotnet test tests/TriQL.IntegrationTests -c Release --no-build --filter "Category!=Spooling"

  aot-smoke:
    # TEST-12 / P6-T9: publish with PublishAot=true and prove it queries a live coordinator with
    # zero trim/AOT warnings. Linux-only — native AOT toolchains differ per OS and the unit-test
    # matrix above already covers cross-platform build correctness.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish AOT smoke app
        run: dotnet publish tests/TriQL.AotSmoke -c Release -r linux-x64 -p:PublishAot=true -o ./aot-smoke-publish

      - name: Start a Trino coordinator
        run: docker run -d --name trino-aot-smoke -p 8080:8080 trinodb/trino:466

      - name: Wait for the HTTP endpoint to report ready
        run: timeout 90 bash -c 'until curl -sf http://localhost:8080/v1/info | grep -q "\"starting\":false"; do sleep 1; done'

      - name: Run the AOT smoke app against the live coordinator
        env:
          TRINO_TEST_SERVER: http://localhost:8080
        # "starting: false" doesn't mean the single-node worker has registered with cluster
        # discovery yet (see TrinoContainerFixture) — a query submitted right after can still fail
        # with "No nodes available to run query". Retry through that warmup window.
        run: |
          for attempt in $(seq 1 20); do
            if ./aot-smoke-publish/TriQL.AotSmoke; then
              exit 0
            fi
            echo "Attempt $attempt failed (coordinator likely still registering its worker); retrying..."
            sleep 3
          done
          echo "::error::AOT smoke app never succeeded against the live coordinator."
          docker logs trino-aot-smoke
          exit 1

      - name: Stop the coordinator
        if: always()
        run: docker rm -f trino-aot-smoke

  spooling-integration-tests:
    # Phase 7 (P7-T4): MinIO plus a spooling-configured Trino coordinator, real-server verification
    # of the spooled protocol (P7-T5...P7-T10). Ubuntu-only per PR — Docker is not reliably
    # available on GitHub-hosted Windows/macOS runners, and this suite's two-container networking
    # approach (see tests/TriQL.IntegrationTests/Fixtures/HostAddress.cs) is validated against
    # Linux Docker bridge networking. The full Trino version matrix runs this suite nightly instead
    # (see .github/workflows/nightly.yml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore (locked mode)
        run: dotnet restore TriQL.slnx --locked-mode

      - name: Build (Release, warnings as errors)
        run: dotnet build TriQL.slnx -c Release --no-restore

      - name: Check for Docker
        id: docker-check
        shell: bash
        run: |
          if docker info > /dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker is not available on this runner — the spooling suite is explicitly skipped, not silently passed (see Phase 0 risk register, P7-T4)."
          fi

      - name: Spooling integration tests (MinIO + spooling-configured Trino)
        if: steps.docker-check.outputs.available == 'true'
        run: dotnet test tests/TriQL.IntegrationTests -c Release --no-build --filter "Category=Spooling"
