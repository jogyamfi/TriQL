name: Manual Publish

# Manual counterpart to release.yml: instead of reacting to a `v*` tag push, this workflow is
# triggered on demand (Actions tab -> "Run workflow") and asks for the version to publish. The
# version is validated with the same rule release.yml enforces on tags (must start with `1.`),
# then a `v<version>` tag is created and pushed, and the rest of the pipeline (restore, build,
# pack, sign placeholder, NuGet trusted-publishing push, GitHub Release) mirrors release.yml.
# Tagging the exact version that was published keeps this run and any future automatic
# release.yml runs for that tag in sync (the NuGet push is idempotent via --skip-duplicate).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 1.4.0 or 1.4.0-beta.1 (must start with 1.)"
        required: true
        type: string

permissions:
  contents: write # to create the git tag and the GitHub Release
  id-token: write # to mint the NuGet trusted-publishing OIDC token

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

concurrency:
  group: manual-publish-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
      tag: ${{ steps.validate.outputs.tag }}
    steps:
      - name: Validate version input
        id: validate
        run: |
          version="${{ inputs.version }}"
          if [[ ! "$version" =~ ^1\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version '$version' is invalid. Expected format 1.x.y or 1.x.y-suffix (must start with '1.')"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  pack-and-publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Check tag does not already exist
        run: |
          if git ls-remote --tags origin "refs/tags/${{ needs.validate.outputs.tag }}" | grep -q .; then
            echo "::error::Tag ${{ needs.validate.outputs.tag }} already exists"
            exit 1
          fi

      - name: Restore (locked mode)
        run: dotnet restore TriQL.slnx --locked-mode

      - name: Build (Release, warnings as errors)
        run: dotnet build TriQL.slnx -c Release --no-restore -p:Version=${{ needs.validate.outputs.version }}

      - name: "Pack shipping packages (REL-4: deterministic, Source Link, .snupkg)"
        run: |
          for proj in TriQL.Client TriQL.Client.Auth TriQL.Client.Compression TriQL.Data.ADO; do
            dotnet pack "src/$proj/$proj.csproj" -c Release --no-build \
              -p:Version=${{ needs.validate.outputs.version }} \
              -o ./artifacts
          done

      # REL-7: sign packages before publishing. Configure a code-signing certificate secret
      # (e.g. via Azure Trusted Signing or a stored .pfx) and uncomment/adapt before first use.
      # - name: Sign packages
      #   run: dotnet nuget sign ./artifacts/*.nupkg --certificate-path <cert> --timestamper http://timestamp.digicert.com

      - name: Publish to NuGet.org (trusted publishing / OIDC)
        # Exchanges the GitHub Actions OIDC token (minted via `id-token: write` above) for a
        # short-lived nuget.org API key valid for 1 hour. Requires a trusted publishing policy on
        # nuget.org for owner `jogyamfi`, repo `TriQL`, workflow file `publish-manual.yml`.
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages and symbols
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/*

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ needs.validate.outputs.tag }}"
          git push origin "${{ needs.validate.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          generate_release_notes: true
          files: ./artifacts/*.nupkg
